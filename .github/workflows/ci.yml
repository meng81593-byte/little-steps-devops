name: CI/CD Pipeline

on:
    push:
        branches: ["main","feat-ci-pipeline"]
    pull_request:
        branches: ["main"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
                node-version: '18'
        
        - name: Install dependencies
          run: npm install

        - name: Install dependencies
          run: npm run build

        - name: Test Docker build
          run: docker build -t little-steps-test .

